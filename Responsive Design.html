
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Contact Us - Vinyl Record Collecting</title>

<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400..700&display=swap" rel="stylesheet">

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: whitesmoke;
    font-family: Georgia, serif;
    color: #333;
}

/* Main page */

#page {
    width: 100%;
    max-width: 928px;
    min-height: 100vh;
    background: white;
    border: 1px solid dimgray;
    box-shadow: 2px 3px 6px gray;
    margin: 0 auto;
}

/* Header image */

header img {
    width: 100%;
    max-width: 100%;
    height: 180px;
    object-fit: cover;
    object-position: top;
    display: block;
}

header h1 {
    font: 48pt/1.4em 'Dancing Script', cursive;
    text-align: center;
    margin: 24px 0;
    text-shadow: 2px 3px 6px goldenrod;
}

/* Navigation */

nav {
    text-align: center;
    margin-bottom: 25px;
}

nav a {
    display: inline-block;
    padding: 8px 24px;
    background: rgba(125,147,151,0.50);
    border-radius: 6px;
    color: black;
    text-decoration: none;
    font: 14pt Arial, sans-serif;
}

nav a:hover {
    background: lightgray;
}

/* Main content */

main {
    width: 80%;
    max-width: 100%;
    margin: 0 auto 40px;
}

h2 {
    text-align: center;
    margin-bottom: 12px;
}

.intro {
    text-align: center;
    line-height: 1.5;
    margin-bottom: 25px;
}

form {
    width: 100%;
    max-width: 100%;
}

label {
    display: block;
    margin: 16px 0 6px;
    font-weight: bold;
}

input[type="text"],
input[type="email"],
select,
textarea {
    width: 100%;
    max-width: 100%;
    padding: 10px;
    border: 1px solid #999;
    border-radius: 4px;
    font: 12pt Arial, sans-serif;
}

textarea {
    height: 150px;
    resize: vertical;
}

/* Radio buttons and checkboxes */

fieldset {
    border: 1px solid #aaa;
    border-radius: 5px;
    padding: 15px;
    margin-top: 20px;
    max-width: 100%;
}

legend {
    padding: 0 8px;
    font-weight: bold;
}

fieldset label {
    display: inline-block;
    margin: 8px 16px 8px 0;
    font-weight: normal;
}

input[type="radio"],
input[type="checkbox"] {
    margin-right: 5px;
}

/* Form buttons */

.buttons {
    margin-top: 22px;
    text-align: center;
}

button {
    padding: 10px 24px;
    margin: 5px;
    border: none;
    border-radius: 5px;
    background: #7d9397;
    color: white;
    font-size: 12pt;
    cursor: pointer;
}

button:hover {
    background: #526b70;
}

/* Footer */

footer {
    width: 80%;
    max-width: 100%;
    margin: 0 auto 35px;
    text-align: center;
    font: 12pt/1.5em Georgia, serif;
}

/* Responsive design for tablets */

@media screen and (max-width: 768px) {

    #page {
        width: 100%;
    }

    header img {
        height: 150px;
    }

    header h1 {
        font-size: 38pt;
    }

    main {
        width: 90%;
    }

    footer {
        width: 90%;
    }

}

/* Responsive design for phones */

@media screen and (max-width: 480px) {

    header img {
        height: 110px;
    }

    header h1 {
        font-size: 30pt;
        margin: 18px 10px;
    }

    nav a {
        padding: 8px 20px;
        font-size: 12pt;
    }

    main {
        width: 92%;
    }

    h2 {
        font-size: 18pt;
    }

    .intro {
        font-size: 11pt;
    }

    fieldset {
        padding: 10px;
    }

    fieldset label {
        display: block;
        margin: 10px 0;
    }

    button {
        padding: 10px 16px;
        font-size: 11pt;
    }

    footer {
        width: 90%;
        font-size: 10pt;
    }

}

</style>

</head>

<body>

<div id="page">

<header>

<img src="vinyl record pic2.jpg" alt="Vinyl records">

<h1>Vinyl Contact Form</h1>

</header>

<nav>
<a href="index.html">Home</a>
</nav>

<main>

<h2>Get in Touch</h2>

<p class="intro">
Have a question about vinyl collecting?
Send me a message using the form below!
</p>

<form action="#" method="post">

<label for="name">Full Name</label>

<input type="text" id="name" name="name"
placeholder="Enter your name" required>

<label for="email">Email Address</label>

<input type="email" id="email" name="email"
placeholder="Enter your email" required>

<label for="subject">Subject</label>

<input type="text" id="subject" name="subject"
placeholder="Enter the subject" required>

<label for="topic">What are you contacting me about?</label>

<select id="topic" name="topic">

<option value="">Choose a topic</option>
<option value="Vinyl Records">Vinyl Records</option>
<option value="Record Stores">Record Stores</option>
<option value="Vinyl Care">Vinyl Care</option>
<option value="other">Other</option>

</select>

<fieldset>

<legend>Do you collect vinyl?</legend>

<label>
<input type="radio" name="experience" value="yes">
Yes
</label>

<label>
<input type="radio" name="experience" value="no">
No
</label>

<label>
<input type="radio" name="experience" value="not-sure">
Not yet, but I want to
</label>

</fieldset>

<fieldset>

<legend>What would you like to learn about?</legend>

<label>
<input type="checkbox" name="interests" value="Vinyl Record Care">
Vinyl Record Care
</label>

<label>
<input type="checkbox" name="interests" value="Music Genres">
Music Genres
</label>

<label>
<input type="checkbox" name="interests" value="Record Players">
Record Players
</label>

</fieldset>

<label for="comments">Comments or Questions</label>

<textarea id="comments" name="comments"
placeholder="Write your message here..."
required></textarea>

<div class="buttons">

<button type="submit">Submit Message</button>

<button type="reset">Clear Form</button>

</div>

</form>

</main>

<footer>

<p>Thank you for visiting Vinyl Record Collecting!</p>

</footer>

</div>

</body>

</html>
